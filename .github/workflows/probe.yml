name: Probe endpoints
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python pipeline/probe_espn.py
      - run: |
          git config user.name "slate-bot"; git config user.email "slate-bot@users.noreply.github.com"
          git add probe.json; git diff --cached --quiet || (git commit -m "Probe results" && git pull --rebase -q && git push)
