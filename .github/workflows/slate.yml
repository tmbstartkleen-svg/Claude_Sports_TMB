name: Build slate
on:
  schedule:
    - cron: "0 15,23 * * *"              # full runs: model rebuild + slate.json + grading + whales (expensive, so 2/day)
    - cron: "*/30 16-23,0-4 * * *"       # capture runs: just snapshot lines for closing-line value, no model rebuild
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: slate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 15,23 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sports-skills
      - run: python pipeline/test_offline.py && python pipeline/test_model.py && python pipeline/test_extras.py && python pipeline/test_markets.py && python pipeline/test_grade.py && python pipeline/test_notify.py && python pipeline/test_soccer.py && python pipeline/test_review.py && python pipeline/test_network.py && python pipeline/test_kalshi.py && python pipeline/test_cache.py && python pipeline/test_whales.py
      - name: Build slate.json (full run)
        if: env.FULL_RUN == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SPORTS: "all"
          SLATE_OUT: slate.json
          HISTORY_PATH: history.json
        run: python pipeline/build_slate.py
      - name: Snapshot lines (capture run, no model rebuild)
        if: env.FULL_RUN != 'true'
        env:
          SPORTS: "all"
          CAPTURE_ONLY: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HISTORY_PATH: history.json
        run: python pipeline/build_slate.py
      - name: Commit if changed
        run: |
          git config user.name "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          for f in results_cache slate.json history.json picks.json record.json alerts.json network_health.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Update slate data" && git pull --rebase -q && git push)
