name: Build slate
on:
  schedule:
    - cron: "5 11,17,23 * * *"           # full runs: model rebuild + slate.json + grading + whales (expensive, so 3/day)
    - cron: "*/15 * * * *"               # capture runs: snapshot lines + check arb/edge/steam alerts, no model rebuild, every 15 min all day so no blind window
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: slate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '5 11,17,23 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install sports-skills cryptography
      - run: python pipeline/test_offline.py && python pipeline/test_model.py && python pipeline/test_extras.py && python pipeline/test_markets.py && python pipeline/test_grade.py && python pipeline/test_notify.py && python pipeline/test_soccer.py && python pipeline/test_review.py && python pipeline/test_network.py && python pipeline/test_kalshi.py && python pipeline/test_cache.py && python pipeline/test_whales.py && python pipeline/test_steam.py && python pipeline/test_scores.py && python pipeline/test_teaminfo.py && python pipeline/test_kalshi_auth.py && python pipeline/test_timing.py && python pipeline/test_live.py && python pipeline/test_parlays.py && python pipeline/test_skills.py
      - name: Build slate.json (full run)
        if: env.FULL_RUN == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SPORTS: "all"
          SLATE_OUT: slate.json
          HISTORY_PATH: history.json
        run: python pipeline/build_slate.py
      - name: Snapshot lines (capture run, no model rebuild)
        if: env.FULL_RUN != 'true'
        env:
          SPORTS: "all"
          CAPTURE_ONLY: "1"
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          KALSHI_KEY_ID: ${{ secrets.KALSHI_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          HISTORY_PATH: history.json
        run: python pipeline/build_slate.py
      - name: Commit if changed
        run: |
          git config user.name "slate-bot"
          git config user.email "slate-bot@users.noreply.github.com"
          for f in results_cache slate.json history.json live.json picks.json record.json alerts.json network_health.json; do [ -e "$f" ] && git add "$f"; done; true
          git diff --cached --quiet || (git commit -m "Update slate data" && git pull --rebase -q && git push)
